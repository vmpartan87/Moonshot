<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no"><meta name="theme-color" content="#05070d">
<link rel="manifest" href="manifest.json"><link rel="icon" type="image/png" href="favicon.png"><link rel="apple-touch-icon" href="apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes"><meta name="mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-status-bar-style" content="black-translucent"><meta name="apple-mobile-web-app-title" content="Moonshot">
<title>Moonshot</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Chakra+Petch:wght@500;600;700&family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@500;700&display=swap">
<style>
/* Layout: one-screen phone trading terminal - header (net worth + clock), live price tape, scrolling view, tab bar; sheets & modals slide over */
:root{
  --bg:#05070d; --bg2:#0a0f1d; --panel:#0e1527; --panel2:#151e36; --line:#1c2744;
  --fg:#e9eefc; --muted:#7d89aa; --dim:#4b5677;
  --up:#22f5a2; --down:#ff3f74; --cyan:#3ad8ff; --gold:#ffc84a; --violet:#a07bff;
  --f-display:'Chakra Petch','Rajdhani',system-ui,sans-serif;
  --f-body:'Inter',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;
  --f-mono:'JetBrains Mono',ui-monospace,'SF Mono',Menlo,Consolas,monospace;
  --gl:max(16px,env(safe-area-inset-left,0px)); --gr:max(16px,env(safe-area-inset-right,0px));
  color-scheme:dark;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
html{height:100%;box-sizing:border-box;background:var(--bg)}
body{height:100%;margin:0;background:var(--bg);color:var(--fg);font:14px/1.4 var(--f-body);overflow:hidden;-webkit-user-select:none;user-select:none;-webkit-tap-highlight-color:transparent;overscroll-behavior:none}
#bgfx{position:fixed;inset:0;pointer-events:none;background:radial-gradient(640px 420px at 88% -12%,rgba(58,216,255,.13),transparent 62%),radial-gradient(520px 520px at -12% 112%,rgba(160,123,255,.11),transparent 62%)}
#bgfx::after{content:"";position:absolute;inset:0;background-image:linear-gradient(rgba(58,216,255,.04) 1px,transparent 1px),linear-gradient(90deg,rgba(58,216,255,.04) 1px,transparent 1px);background-size:28px 28px;-webkit-mask-image:linear-gradient(180deg,#000,transparent 75%);mask-image:linear-gradient(180deg,#000,transparent 75%)}
button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer;-webkit-appearance:none;appearance:none}
button:focus-visible{outline:2px solid var(--cyan);outline-offset:2px}
button:disabled{opacity:.4;cursor:default}
.num{font-family:var(--f-mono);font-variant-numeric:tabular-nums}
.up{color:var(--up)} .down{color:var(--down)} .flat{color:var(--muted)}

.app{position:relative;height:100%;max-width:520px;margin:0 auto;display:flex;flex-direction:column;padding-left:var(--gl);padding-right:var(--gr)}
.app.shake{animation:shake .55s cubic-bezier(.36,.07,.19,.97)}
@keyframes shake{10%,90%{transform:translate(-2px,1px)}20%,80%{transform:translate(4px,-2px)}30%,50%,70%{transform:translate(-7px,2px)}40%,60%{transform:translate(7px,-1px)}}

/* header */
.top{flex:none;padding-block:10px 8px}
.row1{display:flex;align-items:center;gap:10px}
.brand{font:700 17px/1 var(--f-display);letter-spacing:.14em}
.brand span{color:var(--cyan);text-shadow:0 0 12px rgba(58,216,255,.75)}
.clock{margin-left:auto;display:flex;gap:7px;align-items:center;font:700 12px var(--f-mono);color:var(--muted);white-space:nowrap}
.clock .live{width:7px;height:7px;border-radius:50%;background:var(--up);box-shadow:0 0 8px var(--up);animation:blink 1.2s infinite}
.clock.paused .live{background:var(--gold);box-shadow:0 0 8px var(--gold);animation:none}
.clock b{color:var(--fg)}
.dayrow{margin:10px 0 0;gap:8px;font-size:11px}
.dayrow .dayprog{flex:1;margin-top:0;height:5px;position:relative}
.dayrow .dayprog::after{content:"";position:absolute;inset:0;background:repeating-linear-gradient(90deg,transparent 0 calc(20% - 2px),var(--bg) calc(20% - 2px) 20%)}
@keyframes blink{50%{opacity:.25}}
.ctrls{display:flex;gap:6px;margin-left:auto}
.ic{width:34px;height:34px;border-radius:10px;background:var(--panel);border:1px solid var(--line);display:grid;place-items:center;font:700 11px var(--f-mono);color:var(--fg)}
.ic svg{width:16px;height:16px}
.ic.on{color:var(--gold);border-color:rgba(255,200,74,.45)}
.dayprog{height:3px;background:var(--line);border-radius:2px;margin-top:10px;overflow:hidden}
.dayprog i{display:block;height:100%;width:0;background:linear-gradient(90deg,var(--cyan),var(--violet));box-shadow:0 0 10px var(--cyan)}
.nwrow{display:flex;align-items:flex-end;justify-content:space-between;margin-top:10px;gap:12px}
.lbl{font:600 10px/1.2 var(--f-display);letter-spacing:.16em;color:var(--muted);text-transform:uppercase}
.nw{font:700 29px/1.05 var(--f-mono);letter-spacing:-.02em;transition:text-shadow .3s,color .3s;white-space:nowrap}
.nw.gup{color:#c9ffe9;text-shadow:0 0 22px rgba(34,245,162,.7)}
.nw.gdn{color:#ffd0dc;text-shadow:0 0 22px rgba(255,63,116,.7)}
.nwside{text-align:right;display:flex;flex-direction:column;gap:3px;align-items:flex-end;min-width:0}
.chg{font:700 12px var(--f-mono);white-space:nowrap}
.cashl{font-size:12px;color:var(--muted);white-space:nowrap}
.cashl b{color:var(--fg);font:600 12px var(--f-mono)}
.rankchip{font:700 10px var(--f-display);letter-spacing:.14em;color:var(--gold);border:1px solid rgba(255,200,74,.35);background:rgba(255,200,74,.08);padding:2px 7px;border-radius:6px;text-transform:uppercase;white-space:nowrap}

/* price tape */
.ticker{flex:none;height:26px;overflow:hidden;margin-left:calc(-1*var(--gl));margin-right:calc(-1*var(--gr));border-block:1px solid var(--line);background:rgba(10,15,29,.85);display:flex;align-items:center}
.track{display:flex;white-space:nowrap;animation:tape 120s linear infinite;font:700 11px var(--f-mono)}
.track span{padding-right:22px}
.track em{font-style:normal;color:var(--muted);margin-right:6px}
@keyframes tape{to{transform:translateX(-50%)}}

/* main view */
#view{flex:1;min-height:0;overflow-y:auto;overflow-x:hidden;padding-block:12px 18px;scrollbar-width:none;-webkit-overflow-scrolling:touch}
#view::-webkit-scrollbar{display:none}
.tabs{flex:none;display:grid;grid-template-columns:repeat(4,1fr);gap:4px;padding-block:6px 4px;border-top:1px solid var(--line)}
.tab{position:relative;display:flex;flex-direction:column;align-items:center;gap:3px;padding:7px 0;border-radius:12px;color:var(--dim);font:600 10px var(--f-display);letter-spacing:.12em;text-transform:uppercase}
.tab svg{width:21px;height:21px}
.tab.on{color:var(--cyan);background:rgba(58,216,255,.08);text-shadow:0 0 10px rgba(58,216,255,.6)}
.tab .dot{position:absolute;top:5px;right:calc(50% - 18px);min-width:16px;height:16px;padding:0 4px;border-radius:8px;background:var(--down);color:#fff;font:700 10px/16px var(--f-mono);text-shadow:none}
.tradebar{flex:none;display:grid;grid-template-columns:1fr 1fr;gap:10px;padding-block:8px 8px;border-top:1px solid var(--line)}
.btn-long,.btn-short{height:48px;border-radius:14px;font:700 16px var(--f-display);letter-spacing:.16em;display:flex;align-items:center;justify-content:center;gap:8px;transition:transform .08s}
.btn-long:active,.btn-short:active,.big-btn:active{transform:scale(.97)}
.btn-long{background:linear-gradient(180deg,#3bffbb,#10c47f);color:#02150c;box-shadow:0 0 26px rgba(34,245,162,.35),inset 0 1px 0 rgba(255,255,255,.45)}
.btn-short{background:linear-gradient(180deg,#ff6a93,#dc1f55);color:#1b010a;box-shadow:0 0 26px rgba(255,63,116,.35),inset 0 1px 0 rgba(255,255,255,.35)}
.btn-long small,.btn-short small{font:600 10px var(--f-body);letter-spacing:0;opacity:.7}

/* markets */
.pulse{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.pcard{background:linear-gradient(180deg,var(--panel2),var(--panel));border:1px solid var(--line);border-radius:14px;padding:10px 10px 8px;min-width:0}
.pcard b{display:block;font:700 15px var(--f-mono);margin-top:4px}
.pcard canvas{width:100%;height:26px;display:block;margin-top:4px}
.chips{display:flex;gap:6px;overflow-x:auto;margin:14px calc(-1*var(--gr)) 10px 0;padding-right:var(--gr);scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{flex:none;padding:7px 13px;border-radius:999px;border:1px solid var(--line);font:600 12px var(--f-body);color:var(--muted);background:var(--panel)}
.chip.on{color:#03121a;background:var(--cyan);border-color:var(--cyan);box-shadow:0 0 14px rgba(58,216,255,.45)}
.list{display:flex;flex-direction:column;gap:6px}
.arow{display:grid;grid-template-columns:38px minmax(0,1fr) 62px 96px;align-items:center;gap:10px;padding:10px;border-radius:14px;background:var(--panel);border:1px solid transparent;text-align:left;width:100%;position:relative;transition:border-color .3s,box-shadow .3s}
.arow:active{background:var(--panel2)}
.arow.flash{border-color:rgba(255,200,74,.55);box-shadow:0 0 18px rgba(255,200,74,.18)}
.arow.flash::after{content:"NEWS";position:absolute;top:-6px;left:54px;font:700 8px/1 var(--f-display);letter-spacing:.14em;background:var(--gold);color:#1a1200;padding:3px 5px;border-radius:4px}
.logo{width:38px;height:38px;border-radius:11px;display:grid;place-items:center;font:700 17px var(--f-display);color:var(--c);background:color-mix(in srgb,var(--c) 14%,var(--bg2));border:1px solid color-mix(in srgb,var(--c) 45%,transparent);box-shadow:inset 0 0 14px color-mix(in srgb,var(--c) 22%,transparent),0 0 12px color-mix(in srgb,var(--c) 14%,transparent);text-shadow:0 0 10px var(--c)}
.aname{min-width:0}
.aname b{display:block;font:700 14px/1.2 var(--f-display);letter-spacing:.05em}
.aname small{display:block;color:var(--muted);font-size:12px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.spark{width:62px;height:28px;display:block}
.aprice{text-align:right;display:flex;flex-direction:column;align-items:flex-end;gap:3px;min-width:0}
.aprice b{font:600 13px var(--f-mono);white-space:nowrap}
.pill{font:700 11px var(--f-mono);padding:2px 7px;border-radius:6px;white-space:nowrap}
.pill.up{background:rgba(34,245,162,.12);color:var(--up)}
.pill.down{background:rgba(255,63,116,.13);color:var(--down)}
.pill.flat{background:rgba(125,137,170,.12)}
.held{position:absolute;left:5px;top:5px;width:8px;height:8px;border-radius:50%;background:var(--gold);box-shadow:0 0 8px var(--gold)}
.arow.dead{opacity:.45}
.empty{padding:22px 16px;text-align:center;color:var(--muted);border:1px dashed var(--line);border-radius:14px;font-size:13px}

/* detail */
.dhead{display:flex;align-items:center;gap:10px}
.back{width:38px;height:38px;border-radius:11px;background:var(--panel);border:1px solid var(--line);display:grid;place-items:center;flex:none}
.back svg{width:18px;height:18px}
.dn{min-width:0;flex:1}
.dn b{display:block;font:700 18px/1.1 var(--f-display);letter-spacing:.06em}
.dn small{display:block;color:var(--muted);font-size:12px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.volb{font:700 9px var(--f-display);letter-spacing:.14em;padding:4px 7px;border-radius:6px;border:1px solid var(--line);color:var(--muted);white-space:nowrap}
.volb.wild{color:var(--gold);border-color:rgba(255,200,74,.4)}
.volb.extreme{color:var(--down);border-color:rgba(255,63,116,.5);box-shadow:0 0 12px rgba(255,63,116,.25)}
.dprice{display:flex;align-items:baseline;gap:10px;margin-top:12px;flex-wrap:wrap}
.dprice b{font:700 32px/1 var(--f-mono);letter-spacing:-.02em}
.tfs{display:flex;gap:6px;margin:12px 0 8px}
.tf{padding:6px 12px;border-radius:8px;font:700 11px var(--f-mono);color:var(--muted);background:var(--panel);border:1px solid var(--line)}
.tf.on{color:var(--fg);border-color:var(--cyan);background:rgba(58,216,255,.1)}
.chartbox{height:min(270px,38vh);min-height:200px;border-radius:16px;background:linear-gradient(180deg,rgba(16,24,44,.95),rgba(8,12,24,.95));border:1px solid var(--line);position:relative;overflow:hidden}
.chartbox canvas{width:100%;height:100%;display:block;touch-action:none}
.stats{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:6px;margin-top:10px}
.stat{background:var(--panel);border-radius:11px;padding:7px 9px;min-width:0}
.stat b{display:block;font:600 12px var(--f-mono);margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.sec{margin-top:18px}
.fund{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:6px}
.ft{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:8px 10px;min-width:0}
.ft b{display:block;font:700 15px var(--f-mono);margin-top:3px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ft small{display:flex;align-items:center;gap:5px;font-size:11px;margin-top:2px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ft small::before{content:"";flex:none;width:7px;height:7px;border-radius:50%;background:var(--dim)}
.ft small.tg{color:var(--up)} .ft small.tg::before{background:var(--up);box-shadow:0 0 6px var(--up)}
.ft small.tb{color:var(--down)} .ft small.tb::before{background:var(--down);box-shadow:0 0 6px var(--down)}
.ft small.tw{color:var(--gold)} .ft small.tw::before{background:var(--gold);box-shadow:0 0 6px var(--gold)}
.fnote{margin:8px 2px 0;font-size:12px;line-height:1.45;color:var(--muted)}
.sec h3{font:600 11px var(--f-display);letter-spacing:.16em;color:var(--muted);margin:0 0 8px;text-transform:uppercase;display:flex;justify-content:space-between;align-items:center;gap:8px}
.mini{font:700 10px var(--f-display);letter-spacing:.12em;color:var(--down);border:1px solid rgba(255,63,116,.4);padding:4px 8px;border-radius:7px}

/* positions */
.pos{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:11px 12px;display:grid;grid-template-columns:minmax(0,1fr) auto;grid-template-areas:"h p" "m m" "r c";gap:6px 12px;align-items:center}
.pos.danger{border-color:rgba(255,63,116,.6);animation:dangerglow 1s infinite alternate}
@keyframes dangerglow{to{box-shadow:0 0 20px rgba(255,63,116,.35)}}
.ph{grid-area:h;display:flex;align-items:center;gap:8px;min-width:0}
.psym{font:700 15px var(--f-display);letter-spacing:.06em}
.pid{min-width:0}
.prow{display:flex;align-items:center;gap:8px}
.pname{display:flex;align-items:center;gap:6px;margin-top:3px;color:var(--muted);font-size:11px;min-width:0}
.pname span{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0}
.ptype{flex:none;font:700 8px/1 var(--f-display);font-style:normal;letter-spacing:.14em;padding:3px 5px;border-radius:4px;text-transform:uppercase}
.ptype.stock{color:var(--cyan);background:rgba(58,216,255,.12)}
.ptype.crypto{color:#c9b6ff;background:rgba(160,123,255,.18)}
.ptype.cmdty{color:var(--gold);background:rgba(255,200,74,.13)}
.side{font:700 10px var(--f-display);letter-spacing:.12em;padding:2px 7px;border-radius:5px;white-space:nowrap}
.side.long{background:rgba(34,245,162,.15);color:var(--up)}
.side.short{background:rgba(255,63,116,.15);color:var(--down)}
.pnl{grid-area:p;text-align:right;font:700 16px var(--f-mono);white-space:nowrap}
.pnl small{display:block;font:600 11px var(--f-mono);opacity:.85}
.pnl .held-d{color:var(--muted)}
.pmeta{grid-area:m;display:flex;gap:4px 12px;flex-wrap:wrap;font:500 11px var(--f-mono);color:var(--muted)}
.pmeta b{color:var(--fg);font-weight:600}
.pmeta .liq b{color:var(--down)}
.risk{grid-area:r;height:5px;border-radius:3px;background:var(--line);overflow:hidden}
.risk i{display:block;height:100%;border-radius:3px;transition:width .3s}
.closeb{grid-area:c;height:34px;padding:0 16px;border-radius:10px;border:1px solid var(--line);background:var(--panel2);font:700 12px var(--f-display);letter-spacing:.14em}
.trow{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:2px 10px;padding:9px 12px;border-radius:12px;background:var(--panel);font:500 12px var(--f-mono)}
.trow small{color:var(--muted);font-size:11px}
.trow .r{text-align:right;font-weight:700}

/* portfolio */
.card{background:linear-gradient(180deg,var(--panel2),var(--panel));border:1px solid var(--line);border-radius:18px;padding:14px}
.card .big{display:block;font:700 26px var(--f-mono);margin-top:4px}
.card canvas{width:100%;height:120px;display:block;margin-top:10px}
.kv{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:6px;margin-top:10px}
.kv div{min-width:0}
.kv b{display:block;font:700 13px var(--f-mono);margin-top:2px;white-space:nowrap}

/* news */
.nitem{display:block;width:100%;text-align:left;padding:11px 12px;border-radius:14px;background:var(--panel);border:1px solid var(--line)}
.nitem.brk{border-color:rgba(255,63,116,.35)}
.nitem.fill .nh{color:var(--muted);font-weight:500}
.nmeta{display:flex;gap:6px;align-items:center;flex-wrap:wrap;font:600 10px var(--f-mono);color:var(--muted)}
.tagc{font:700 9px/1 var(--f-display);letter-spacing:.12em;padding:3px 6px;border-radius:5px;white-space:nowrap}
.t-breaking{background:var(--down);color:#fff;box-shadow:0 0 10px rgba(255,63,116,.5)}
.t-rumor{background:rgba(160,123,255,.2);color:#c9b6ff}
.t-tip{background:rgba(255,200,74,.16);color:var(--gold)}
.t-market,.t-crypto{background:rgba(58,216,255,.14);color:var(--cyan)}
.t-ipo{background:var(--violet);color:#fff}
.t-sym{background:rgba(233,238,252,.08);color:var(--fg)}
.t-rel{background:rgba(34,245,162,.14);color:var(--up)}
.t-sk{background:rgba(255,63,116,.14);color:var(--down)}
.nh{font:600 14px/1.35 var(--f-body);margin-top:6px;color:var(--fg);text-wrap:pretty}
.nsince{font:700 11px var(--f-mono);margin-top:6px}
.cal{display:flex;flex-direction:column;gap:6px}
.calrow{display:grid;grid-template-columns:84px minmax(0,1fr) auto;gap:10px;align-items:center;padding:10px 12px;border-radius:12px;background:linear-gradient(90deg,rgba(255,200,74,.09),var(--panel) 60%);border:1px solid rgba(255,200,74,.2);text-align:left;width:100%}
.calrow .when{font:700 11px var(--f-mono);color:var(--gold)}
.calrow b{font:600 13px var(--f-body);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}

/* career */
.rankhero{text-align:center;padding:20px 14px}
.rankhero .rn{font:700 30px/1.1 var(--f-display);letter-spacing:.1em;color:var(--gold);text-shadow:0 0 22px rgba(255,200,74,.5);text-transform:uppercase;margin-top:6px}
.prog{height:8px;border-radius:4px;background:var(--line);overflow:hidden;margin-top:14px}
.prog i{display:block;height:100%;background:linear-gradient(90deg,var(--gold),#ff9f1c);box-shadow:0 0 12px var(--gold)}
.ladder{display:flex;flex-direction:column;gap:6px}
.rung{display:grid;grid-template-columns:28px minmax(0,1fr) auto;gap:10px;align-items:center;padding:10px 12px;border-radius:12px;background:var(--panel);border:1px solid var(--line)}
.rung .i{font:700 12px var(--f-mono);color:var(--dim);text-align:center}
.rung b{display:block;font:700 13px var(--f-display);letter-spacing:.08em;text-transform:uppercase}
.rung small{display:block;color:var(--muted);font-size:11px}
.rung .th{font:700 12px var(--f-mono);color:var(--muted)}
.rung.got{border-color:rgba(255,200,74,.3)}
.rung.got .i,.rung.got .th{color:var(--gold)}
.rung.cur{background:linear-gradient(90deg,rgba(255,200,74,.12),var(--panel));box-shadow:0 0 18px rgba(255,200,74,.12)}
.rung.lock{opacity:.5}
.setrow{display:flex;gap:8px;flex-wrap:wrap}
.btn2{padding:10px 14px;border-radius:11px;background:var(--panel);border:1px solid var(--line);font:600 13px var(--f-body)}
.btn2.danger{color:var(--down);border-color:rgba(255,63,116,.4)}

/* toasts */
#toasts{position:absolute;left:var(--gl);right:var(--gr);top:var(--toast-top,120px);z-index:30;display:flex;flex-direction:column;gap:6px;pointer-events:none}

let G = null;

const alive = () => G.assets.filter(a => !a.dead);
const baseDrift = a => a.t === 'stock' ? .0025 : a.t === 'crypto' ? .003 : .0008;
const volScale = a => clamp(Math.sqrt(a.v / .045), .6, 1.45);
const chg = a => a.price / a.prevClose - 1;

function makeAsset(def, history) {
  const a = { ...def, tags: [...def.tags], price: def.p, open: def.p, hi: def.p, lo: def.p, prevClose: def.p,
    trend: 0, vm: 1, ticks: [def.p], days: [], pend: [], dead: false, newsTicks: [], flash: -99, ipo: history ? 0 : def.p };
  if (history) {
    let lp = 0, tr = 0; const path = [];
    for (let d = 0; d < 90; d++) {
      tr = tr * .7 + randn() * def.v * .25;
      const o = lp; let h = lp, l = lp;
      for (let k = 0; k < 12; k++) { lp += tr / 12 + randn() * def.v / Math.sqrt(12); h = Math.max(h, lp); l = Math.min(l, lp); }
      path.push([o, h, l, lp]);
    }
    const off = Math.log(def.p) - lp;
    a.days = path.map(([o, h, l, c]) => ({ o: Math.exp(o + off), h: Math.exp(h + off), l: Math.exp(l + off), c: Math.exp(c + off) }));
  }
  a.trend = baseDrift(a) + randn() * def.v * .2;
  makeFund(a);
  return a;
}

  openDay();
}

/* ---------- scheduling ---------- */
function q(it) { G.queue.push(it); }

function scheduleDay(d, first = false) {
  const n = randi(8, 13); // longer day, more assets, more news
  for (let i = 0; i < n; i++) {
    let tick = first && i === 0 ? randi(30, 45) : randi(6, TPD - 6);
    if (!first && i === 0 && Math.random() < .45) tick = 0; // weekend gap
    if (Math.random() < .12) {
      const e = wpick(GROUP_EVENTS, x => x.w);
      q({ day: d, tick, kind: 'grp', scope: e.scope, h: e.h, imp: rand(...e.imp), also: e.also || null });
      continue;
    }
    const a = wpick(alive(), x => 1 + x.v * 12);
    const opts = EVENTS.filter(e => e.f(a)); if (!opts.length) continue;
    const e = wpick(opts, x => eventWeight(a, x));
    q({ day: d, tick, kind: 'ev', sym: a.s, h: tpl(e.h, a), imp: rand(...e.imp) * volScale(a), also: e.also || null });
  }
  const nf = randi(3, 5);
  for (let i = 0; i < nf; i++) {
    const tick = randi(4, TPD - 4);
    if (Math.random() < .35) q({ day: d, tick, kind: 'fill', h: pick(FILLER_GLOBAL), imp: 0 });
    else { const a = pick(alive()); q({ day: d, tick, kind: 'fill', sym: a.s, h: tpl(pick(FILLER), a), imp: rand(-.015, .015) }); }
  }
  const ns = first ? 1 : (Math.random() < .7 ? 1 : 0) + (Math.random() < .3 ? 1 : 0);
  for (let i = 0; i < ns; i++) startStory(d, first ? randi(12, 22) : randi(5, TPD - 40));
}

function startStory(d, tick) {
  const active = G.stories.filter(s => !s.done);
  if (active.length >= 5) return;
  const busy = new Set(active.map(s => s.sym || s.scope));
  for (let tries = 0; tries < 12; tries++) {
    const st = wpick(STORIES, x => x.w);
    let a = null;
    if (st.scope) { if (busy.has(st.scope)) continue; }
    else { const c = alive().filter(x => st.f(x) && !busy.has(x.s)); if (!c.length) continue; a = pick(c); }
    const k = a ? volScale(a) : 1;
    const delay = randi(...st.delay), od = d + delay;
    const gap = Math.random() < .3, ot = gap ? 0 : randi(10, TPD - 10);
    let p0 = st.out[0].p;
    if (a) { p0 += .15 * quality(a); if (st.id === 'listing' && a.fu && a.fu.whale > .65) p0 -= .15; }
    const oi = Math.random() < clamp(p0, .2, .85) ? 0 : 1;
    const id = G.nid++;
    const sym = a ? a.s : null, scope = st.scope || null;
    G.stories.push({ id, st: st.id, sym, scope, cal: st.cal, day: od, tick: ot, teased: false, done: false });
    q({ day: d, tick, kind: 'tease', story: id, sym, scope, h: tpl(st.teaser.h, a), imp: rand(...st.teaser.imp) * k, also: st.also || null, rumor: !!st.rumor });
    if (Math.random() < .78) {
      const acc = Math.random() < .75;
      const showsGood = acc ? oi === 0 : oi !== 0;
      let hd = od - 1, ht;
      if (hd === d) { if (tick > TPD - 25) { hd = -1; } else ht = randi(tick + 12, TPD - 5); }
      else ht = randi(10, TPD - 10);
      if (hd > 0) {
        const rating = acc ? (Math.random() < .8 ? 'RELIABLE' : 'SKETCHY') : (Math.random() < .8 ? 'SKETCHY' : 'RELIABLE');
        q({ day: hd, tick: ht, kind: 'hint', story: id, sym, scope, h: tpl(showsGood ? st.hintGood : st.hintBad, a),
          imp: (showsGood ? rand(.02, .06) : -rand(.02, .06)) * (scope ? .4 : k), rating });
      }
    }
    const o = st.out[oi];
    q({ day: od, tick: ot, kind: 'out', story: id, sym, scope, h: tpl(o.h, a), imp: rand(...o.imp) * k, also: st.also || null });
    return;
  }
}

/* ---------- impacts ---------- */
function pushImpact(a, imp, gap, quiet) {
  imp = clamp(imp, -.95, 12);
  const L = Math.log(1 + imp);
  const g = gap ? rand(.75, .95) : rand(.2, .45);
  a.price = Math.max(1e-7, a.price * Math.exp(L * g));
  a.hi = Math.max(a.hi, a.price); a.lo = Math.min(a.lo, a.price);
  const rest = L * (1 - g), n = randi(15, 50);
  if (Math.random() < .22) {        // overshoot, then give some back
    a.pend.push({ tot: rest + L * .25, n, d: 0 });
    a.pend.push({ tot: -L * .25, n: randi(25, 60), d: n });
  } else a.pend.push({ tot: rest, n, d: 0 });
  if (imp > 0 && !quiet && Math.random() < .1) a.pend.push({ tot: -L * .45, n: 60, d: n + 5 }); // sell the news
  a.vm = Math.min(3.5, a.vm + Math.min(2, Math.abs(L) * 6));
  a.trend += Math.sign(L) * Math.min(.01, Math.abs(L) * .03);
}
function groupImpact(scope, imp, gap) {
  for (const b of alive()) {
    let k = 0;
    if (scope === 'market') k = b.t === 'stock' ? b.b : b.t === 'crypto' ? .5 : 0;
    else if (scope === 'crypto') k = b.t === 'crypto' ? b.b : 0;
    if (k && b.t === 'stock' && b.fu) k *= 1 + Math.max(0, b.fu.gear - .8) * .4; // indebted firms feel macro shocks harder
    if (k) pushImpact(b, imp * k * rand(.75, 1.25), gap, true);
  }
}

function fire(it) {
  const a = it.sym ? A(it.sym) : null;
  if (it.sym && (!a || a.dead)) return;
  const s = it.story ? G.stories.find(x => x.id === it.story) : null;
  if (it.kind === 'tease' && s) s.teased = true;
  if (it.kind === 'out' && s) s.done = true;
  const px = a ? a.price : null;
  const gap = it.tick === 0;
  if (it.imp) { if (a) pushImpact(a, it.imp, gap); else if (it.scope) groupImpact(it.scope, it.imp, gap); }
  if (a) fundOnNews(a, it);
  if (it.also) for (const al of it.also) for (const b of alive()) if (b !== a && b.tags.includes(al.tag)) pushImpact(b, it.imp * al.m * rand(.7, 1.2), gap, true);
  let tag = '';
  if (it.kind === 'hint') tag = 'TIP';
  else if (it.rumor) tag = 'RUMOR';
  else if (it.kind !== 'fill' && Math.abs(it.imp || 0) >= .15) tag = 'BREAKING';
  else if (it.scope) tag = it.scope.toUpperCase();
  addNews({ kind: it.kind, sym: it.sym || null, scope: it.scope || null, h: it.h, tag, px, rating: it.rating || null, imp: it.imp || 0, gap });
}

function addNews(n) {
  n.id = G.nid++; n.day = G.day; n.tick = G.tick;
  G.news.unshift(n); if (G.news.length > 160) G.news.length = 160;
  if (n.sym) { const a = A(n.sym); if (a) { a.newsTicks.push(G.tick); a.flash = G.tick; } }
  UI.onNews(n);
}

/* ---------- tick ---------- */
function tick() {
  if (G.phase !== 'open') return;
  G.tick++;
  const sq = Math.sqrt(TPD);
  const m = G.mkt / TPD + .009 / sq * randn();
  const c = G.cry / TPD + .02 / sq * randn();
  for (const a of G.assets) {
    if (a.dead) continue;
    const z = randn() * (Math.random() < .02 ? 2.6 : 1);
    let r = a.trend / TPD + a.v / sq * a.vm * z;
    r += a.t === 'stock' ? a.b * m : a.t === 'crypto' ? a.b * c : a.b * m * .5;
    for (let i = a.pend.length - 1; i >= 0; i--) {
      const p = a.pend[i];
      if (p.d > 0) { p.d--; continue; }
      const take = p.n <= 1 ? p.tot : p.tot / p.n * rand(.3, 1.7);
      p.tot -= take; p.n--; r += take;
      if (p.n <= 0) a.pend.splice(i, 1);
    }
    a.vm = clamp(a.vm * .985 + .015 * Math.abs(z) * 1.25, .6, 3.5);
    a.price = Math.max(1e-7, a.price * Math.exp(r));
    a.hi = Math.max(a.hi, a.price); a.lo = Math.min(a.lo, a.price);
    a.ticks.push(a.price);
  }
  const due = G.queue.filter(it => it.day === G.day && it.tick === G.tick);
  if (due.length) { G.queue = G.queue.filter(it => !due.includes(it)); due.forEach(fire); }
  checkBankrupt();
  checkPositions();
  checkRank();
  if (G.tick % 20 === 0) save();
  UI.onTick();
  if (G.tick >= TPD) endDay();
}

function checkBankrupt() {
  for (const a of G.assets) {
    if (a.dead || a.t === 'cmdty') continue;
    const ref = Math.max(a.ipo || 0, a.open, ...a.days.slice(-20).map(d => d.c));
    if (a.price < ref * .04) {
      a.dead = true;
      addNews({ kind: 'dead', sym: a.s, h: a.t === 'stock' ? `BANKRUPT: ${a.n} files for Chapter 11. Trading halted` : `${a.n} declared dead. Delisted from every exchange`, tag: 'BREAKING', px: a.price, imp: -1 });
      for (const p of G.positions.filter(p => p.sym === a.s)) closePosition(p, 'halt');
    }
  }
}

/* ---------- trading ---------- */
const posPnl = p => (p.side === 'long' ? 1 : -1) * p.qty * (A(p.sym).price - p.entry);
const posEq = p => p.margin + posPnl(p);
const liqPrice = p => p.side === 'long' ? p.entry * (1 - LIQ / p.lev) : p.entry * (1 + LIQ / p.lev);
function netWorth() { let v = G.cash; for (const p of G.positions) v += Math.max(0, posEq(p)); return v; }
function levels() { return RANKS[G.rank].lev; }

function openPosition(sym, side, amount, lev, tp, sl) {
  const a = A(sym); if (!a || a.dead) return null;
  amount = Math.min(amount, G.cash); if (amount < 1) return null;
  const margin = amount / (1 + lev * FEE);
  G.cash -= amount;
  const p = { id: G.nid++, sym, side, lev, margin, entry: a.price, qty: margin * lev / a.price, tp, sl, day: G.day, tick: G.tick };
  G.positions.push(p); G.lastLev = lev;
  return p;
}

function closePosition(p, reason) {
  const a = A(p.sym);
  let eq = p.margin + posPnl(p);
  if (reason === 'liq' || reason === 'halt') eq = Math.max(0, eq);
  else eq = Math.max(0, eq - Math.abs(p.qty * a.price) * FEE);
  G.cash += eq;
  const net = eq - p.margin;
  G.positions = G.positions.filter(x => x !== p);
  const S = G.stats;
  S.realized += net; S.trades++; if (net >= 0) S.wins++; else S.losses++;
  S.best = Math.max(S.best, net); S.worst = Math.min(S.worst, net);
  if (reason === 'liq') S.liqs++;
  G.trades.unshift({ sym: p.sym, side: p.side, lev: p.lev, margin: p.margin, pnl: net, roe: net / p.margin, reason, day: G.day });
  if (G.trades.length > 40) G.trades.length = 40;
  UI.onClose(p, net, reason);
  return net;
}

function checkPositions() {
  for (const p of G.positions.slice()) {
    const eq = posEq(p), roe = (eq - p.margin) / p.margin;
    if (eq <= p.margin * (1 - LIQ)) closePosition(p, 'liq');
    else if (p.tp && roe >= p.tp) closePosition(p, 'tp');
    else if (p.sl && roe <= -p.sl) closePosition(p, 'sl');
  }
  if (!G.positions.length && G.cash < 100) UI.bailout();
}

function checkRank() {
  const nw = netWorth();
  if (nw > G.peak) G.peak = nw;
  let idx = 0; RANKS.forEach((r, i) => { if (G.peak >= r.min) idx = i; });
  if (idx > G.rank) { G.rank = idx; UI.rankUp(RANKS[idx]); }
}

/* ---------- day cycle ---------- */
function endDay() {
  G.phase = 'closed';
  const movers = [];
  for (const a of G.assets) {
    if (a.dead) continue;
    a.days.push({ o: a.open, h: a.hi, l: a.lo, c: a.price });
    if (a.days.length > 120) a.days.shift();
    movers.push({ s: a.s, ch: chg(a) });
    a.trend = a.trend * .5 + .5 * (baseDrift(a) + randn() * a.v * .22);
    if (a.t === 'cmdty') a.trend += clamp(.04 * Math.log(a.p / a.price), -.02, .02); // commodities drift back toward fair value
    fundDaily(a);
  }
  G.mkt = G.mkt * .5 + .5 * (.001 + randn() * .004);
  G.cry = G.cry * .5 + .5 * (.0015 + randn() * .012);
  const nw = netWorth(); G.nwHist.push(nw);
  if (G.nwHist.length > 400) G.nwHist.shift();
  movers.sort((x, y) => y.ch - x.ch);
  scheduleDay(G.day + 1);
  save();
  UI.showDayEnd({ day: G.day, pnl: nw - G.dayStartNW, pct: (nw - G.dayStartNW) / G.dayStartNW, nw, top: movers[0], bot: movers[movers.length - 1] });
}

function nextIpo(type) {
  const pool = type === 'crypto' ? COIN_POOL : IPO_POOL;
  const present = new Set(G.assets.map(a => a.s));
  let c = pool.filter(d => !present.has(d.s) && !G.usedPool.includes(d.s));
  if (!c.length) c = pool.filter(d => !present.has(d.s));
  if (!c.length) return null;
  const d = pick(c); G.usedPool.push(d.s);
  return { ...d, p: d.p * rand(.7, 1.4) };
}

function nextDay() {
  G.day++; G.tick = 0;
  const ipos = [];
  G.assets.forEach((a, i) => {
    if (!a.dead) return;
    const def = nextIpo(a.t);
    if (def) { G.assets[i] = makeAsset(def, false); ipos.push(G.assets[i]); }
  });
  openDay(ipos);
  G.phase = 'open';
  save();
}

function openDay(ipos = []) {
  for (const a of G.assets) { a.prevClose = a.price; a.newsTicks = []; a.flash = -99; }
  for (const a of ipos) addNews({ kind: 'ipo', sym: a.s, h: `IPO: ${a.n} (${a.s}) starts trading this week`, tag: 'IPO', px: a.price, imp: 0 });
  const due = G.queue.filter(it => it.day === G.day && it.tick === 0);
  G.queue = G.queue.filter(it => !due.includes(it));
  due.forEach(fire);
  for (const a of G.assets) { a.open = a.price; a.hi = a.lo = a.price; a.ticks = [a.price]; }
  G.queue = G.queue.filter(it => it.day >= G.day);
  G.stories = G.stories.filter(s => !s.done || s.day >= G.day - 1);
  checkPositions();
  G.dayStartNW = netWorth();
}

/* ---------- old saves get the new stocks ---------- */
function migrate() {
  for (const a of G.assets) if (!a.fu) makeFund(a);
  if (G.v2) return;
  const add = NEW_STOCKS.filter(d => !G.assets.some(a => a.s === d.s)).map(d => {
    const a = makeAsset(d, true);
    a.prevClose = a.open = a.hi = a.lo = a.price; a.ticks = Array(G.tick + 1).fill(a.price);
    return a;
  });
  const at = G.assets.findIndex(a => a.t !== 'stock');
  G.assets.splice(at < 0 ? G.assets.length : at, 0, ...add);
  G.v2 = true;
}
/* ---------- save ---------- */
function save() { try { localStorage.setItem(SAVE_KEY, JSON.stringify(G)); } catch (e) { } }
function loadSave() { try { const s = localStorage.getItem(SAVE_KEY); if (s) { const g = JSON.parse(s); if (g && g.ver === 1) return g; } } catch (e) { } return null; }
function wipeSave() { try { localStorage.removeItem(SAVE_KEY); } catch (e) { } }
/* ===== company fundamentals =====
   Each asset carries a.fu. Fundamentals are not decoration: they tilt daily drift,
   which news is likely to hit, story outcomes, and how hard market shocks land. */
const fairPE = fu => clamp(10 + 80 * Math.max(fu.g, 0) + 20 * Math.max(fu.m, 0), 6, 60);

function makeFund(a) {
  if (a.t === 'stock') {
    const small = a.tags.includes('small');
    const loss = Math.random() < (small ? .4 : .1);
    const g = small ? rand(-.1, .55) : rand(-.05, .25);
    const m = loss ? -rand(.05, .35) : rand(.03, .3);
    const gear = clamp(rand(-.3, 1.1) + (Math.random() < .22 ? rand(.4, 1.4) : 0), -.4, 2.8);
    const fu = { g, m, gear, eps: 0, div: 0, si: 0, shares: 0, rating: 'Hold' };
    fu.eps = loss ? -a.price / rand(15, 60) : a.price / (fairPE(fu) * Math.exp(randn() * .4));
    fu.div = small || loss ? 0 : (Math.random() < .6 ? rand(.005, .05) : 0);
    fu.shares = (small ? rand(2e8, 3e9) : rand(5e9, 2e11)) / a.price;
    a.fu = fu;
    const q = quality(a);
    fu.si = rand(.01, .07) + (q < 0 ? -q * .22 : 0) + (small ? rand(0, .06) : 0);
  } else if (a.t === 'crypto') {
    const meme = a.tags.includes('meme'), major = a.tags.includes('major');
    a.fu = { whale: meme ? rand(.45, .85) : major ? rand(.15, .35) : rand(.3, .65),
      dev: Math.round(major ? rand(60, 95) : meme ? rand(5, 45) : rand(25, 85)),
      hold: rand(-.04, .12), shares: (major ? rand(1e11, 1.3e12) : meme ? rand(1e8, 5e9) : rand(1e9, 6e10)) / a.price, rating: 'Hold' };
  } else {
    a.fu = { inv: rand(-.25, .25), rating: 'Hold' };
  }
  rateAnalyst(a);
  return a.fu;
}

function quality(a) {
  const f = a.fu; if (!f) return 0;
  if (a.t === 'stock') return clamp(f.g * 2 + f.m * 2 - (f.gear - .6) * .5 - (f.eps < 0 ? .3 : 0), -1, 1);
  if (a.t === 'crypto') return clamp((f.dev - 50) / 100 + f.hold * 3 - (f.whale - .4), -1, 1);
  return clamp(-f.inv * 3, -1, 1);
}
function valuation(a) {
  if (a.t !== 'stock' || !a.fu || a.fu.eps <= 0) return 0;
  return clamp(Math.log(fairPE(a.fu) / (a.price / a.fu.eps)), -1, 1);
}
function rateAnalyst(a) {
  const s = quality(a) * .6 + valuation(a) * .5 + randn() * .25;
  a.fu.rating = s > .5 ? 'Strong Buy' : s > .15 ? 'Buy' : s > -.15 ? 'Hold' : s > -.5 ? 'Sell' : 'Strong Sell';
}

/* daily evolution, called at the close */
function fundDaily(a) {
  const f = a.fu; if (!f) return;
  if (a.t === 'stock') {
    f.gear = clamp(f.gear + randn() * .02, -.4, 3);
    f.g = clamp(f.g + randn() * .006, -.35, .9);
    f.m = clamp(f.m + randn() * .002 + (f.g > .15 ? .0006 : 0), -.6, .45);
    if (f.eps > 0) f.eps *= 1 + f.g / 52; // growth is annual, one session = one week
    else { f.eps *= 1 - f.g / 52; if (f.m > .01) f.eps = a.price / (fairPE(f) * 1.5); }
    f.si = clamp(f.si * .97 + (quality(a) < 0 ? .004 : .001) + randn() * .003, .005, .45);
  } else if (a.t === 'crypto') {
    f.whale = clamp(f.whale + randn() * .006, .08, .95);
    f.dev = clamp(Math.round(f.dev + randn() * 2), 0, 100);
    f.hold = clamp(f.hold * .9 + randn() * .01, -.3, .5);
  } else f.inv = clamp(f.inv * .97 + randn() * .012, -.5, .5);
  a.trend += .002 * quality(a) + .002 * valuation(a);
  rateAnalyst(a);
}

/* news changes the numbers too */
function fundOnNews(a, it) {
  const f = a.fu; if (!f || !it.imp || it.kind === 'fill' || it.kind === 'hint') return;
  const imp = clamp(it.imp, -.6, 1);
  if (a.t === 'stock') {
    if (f.eps > 0) f.eps *= 1 + imp * rand(.3, .7);
    else if (imp > 0) f.eps *= 1 - imp * .3;
    f.g = clamp(f.g + imp * .15, -.35, .9);
    if (imp < 0 && /debt|lawsuit|probe|share sale|cash/i.test(it.h)) f.gear = clamp(f.gear + .15, -.4, 3);
    if (/share sale/i.test(it.h)) f.shares *= 1.15;
    if (/SHORT SQUEEZE/.test(it.h)) f.si *= .4;
  } else if (a.t === 'crypto') {
    f.hold = clamp(f.hold + imp * .05, -.3, .5);
    if (/hack|outage|down for/i.test(it.h)) f.dev = clamp(f.dev - 8, 0, 100);
    if (/upgrade/i.test(it.h)) f.dev = clamp(f.dev + 6, 0, 100);
  } else f.inv = clamp(f.inv - imp * .4, -.5, .5);
}

/* event weighting: good companies attract good news */
function eventWeight(a, e) {
  const q = quality(a);
  return e.w * (e.imp[0] >= 0 ? 1 + .7 * q : 1 - .7 * q);
}

/* display */
function fundTiles(a) {
  const f = a.fu; if (!f) return [];
  const T = (l, v, note, tone) => ({ l, v, note, tone });
  const pct = x => (x * 100).toFixed(Math.abs(x) < .1 ? 1 : 0) + '%';
  const mc = (f.shares || 0) * a.price;
  if (a.t === 'stock') {
    const pe = f.eps > 0 ? a.price / f.eps : null, r = pe ? pe / fairPE(f) : 0;
    return [
      T('P/E', pe ? pe.toFixed(1) : 'n/a', !pe ? 'losing money' : r < .75 ? 'cheap for its growth' : r < 1.3 ? 'fairly priced' : r < 2 ? 'pricey' : 'bubble territory', !pe ? 'b' : r < .75 ? 'g' : r < 1.3 ? 'n' : 'b'),
      T('Earnings growth', (f.g >= 0 ? '+' : '') + pct(f.g), f.g > .2 ? 'fast grower' : f.g > .05 ? 'steady' : f.g > -.05 ? 'flat' : 'shrinking', f.g > .05 ? 'g' : f.g > -.05 ? 'n' : 'b'),
      T('Profit margin', pct(f.m), f.m > .2 ? 'fat margins' : f.m > .08 ? 'healthy' : f.m > 0 ? 'thin' : 'burning cash', f.m > .08 ? 'g' : f.m > 0 ? 'n' : 'b'),
      T('Gearing', f.gear < 0 ? 'net cash' : pct(f.gear), f.gear < 0 ? 'more cash than debt' : f.gear < .5 ? 'low debt' : f.gear < 1 ? 'moderate debt' : f.gear < 1.5 ? 'heavy debt' : 'danger zone', f.gear < .5 ? 'g' : f.gear < 1 ? 'n' : 'b'),
      T('Dividend yield', f.div ? pct(f.div) : '–', f.div > .03 ? 'cash cow' : f.div ? 'pays dividend' : 'no dividend', f.div > .03 ? 'g' : 'n'),

  ctx.beginPath(); s.forEach((v, i) => i ? ctx.lineTo(x(i), y(v)) : ctx.moveTo(x(i), y(v))); ctx.lineTo(x(s.length - 1), H); ctx.lineTo(x(0), H); ctx.closePath(); ctx.fillStyle = g; ctx.fill();
  ctx.beginPath(); s.forEach((v, i) => i ? ctx.lineTo(x(i), y(v)) : ctx.moveTo(x(i), y(v)));
  ctx.strokeStyle = color; ctx.lineWidth = 2; ctx.shadowColor = color; ctx.shadowBlur = 10; ctx.stroke(); ctx.shadowBlur = 0;
  ctx.fillStyle = color; ctx.beginPath(); ctx.arc(x(s.length - 1), y(s[s.length - 1]), 3.5, 0, 7); ctx.fill();
}

const StartFx = {
  pts: [], t: 0,
  draw(cv, now) {
    const f = fitCanvas(cv); if (!f) return;
    const { ctx, W, H } = f;
    if (!this.pts.length) { let v = H * .7; for (let i = 0; i < 90; i++) { v += randn() * 8 - 1.2; this.pts.push(v); } }
    this.t += 1;
    if (this.t % 4 === 0) { let v = this.pts[this.pts.length - 1] + randn() * 9 - 1.4; if (v < H * .2) v += 30; if (v > H * .9) v -= 30; this.pts.push(v); this.pts.shift(); }
    const step = W / (this.pts.length - 6), off = (this.t % 4) / 4 * step;
    ctx.strokeStyle = 'rgba(58,216,255,.06)'; ctx.lineWidth = 1;
    for (let gx = 0; gx < W; gx += 32) { ctx.beginPath(); ctx.moveTo(gx, 0); ctx.lineTo(gx, H); ctx.stroke(); }
    for (let gy = 0; gy < H; gy += 32) { ctx.beginPath(); ctx.moveTo(0, gy); ctx.lineTo(W, gy); ctx.stroke(); }
    ctx.beginPath(); this.pts.forEach((v, i) => { const xx = i * step - off; i ? ctx.lineTo(xx, v) : ctx.moveTo(xx, v); });
    const g = ctx.createLinearGradient(0, 0, W, 0); g.addColorStop(0, 'rgba(160,123,255,0)'); g.addColorStop(.5, 'rgba(58,216,255,.6)'); g.addColorStop(1, '#22f5a2');
    ctx.strokeStyle = g; ctx.lineWidth = 2.5; ctx.shadowColor = '#3ad8ff'; ctx.shadowBlur = 16; ctx.stroke(); ctx.shadowBlur = 0;
    const lx = (this.pts.length - 1) * step - off, ly = this.pts[this.pts.length - 1];
    ctx.fillStyle = '#22f5a2'; ctx.shadowColor = '#22f5a2'; ctx.shadowBlur = 20; ctx.beginPath(); ctx.arc(lx, ly, 5, 0, 7); ctx.fill(); ctx.shadowBlur = 0;
    const vg = ctx.createRadialGradient(W / 2, H / 2, H * .1, W / 2, H / 2, H * .75); vg.addColorStop(0, 'rgba(5,7,13,.55)'); vg.addColorStop(1, 'rgba(5,7,13,.92)');
    ctx.fillStyle = vg; ctx.fillRect(0, 0, W, H);
  }
};

        <div><div class="lbl">Liquidated</div><b class="${S.liqs ? 'down' : ''}">${S.liqs}</b></div></div></div>
      <div class="sec"><h3>Open positions ${G.positions.length > 1 ? '<button class="mini" data-act="closeall">CLOSE ALL</button>' : ''}</h3><div class="list" id="plist"></div></div>
      <div class="sec"><h3>Recent trades</h3><div class="list">${G.trades.length ? G.trades.slice(0, 15).map(t => `<div class="trow"><span>${t.sym} <span class="side ${t.side}">${t.side.toUpperCase()} ${t.lev}×</span></span><span class="r ${dirCls(t.pnl)}">${fmtMoney(t.pnl, true)}</span><small>Week ${t.day} · ${{ manual: 'Closed', tp: 'Take profit', sl: 'Stop loss', liq: 'LIQUIDATED', halt: 'Trading halted' }[t.reason]}</small><small class="r ${dirCls(t.roe)}">${fmtPct(t.roe)}</small></div>`).join('') : '<div class="empty">No closed trades yet.</div>'}</div></div>`;
  },
  livePortfolio(draw) {
    const nw = netWorth(), inv = START_CASH + G.bailouts * BAILOUT, r = nw / inv - 1;
    const t = $('#view [data-f=tot]'); if (t) { t.textContent = `${fmtMoney(nw - inv, true)} (${fmtPct(r)})`; t.className = 'big ' + dirCls(r); }
    this.syncPos($('#plist'), G.positions.slice().sort((x, y) => x.sym.localeCompare(y.sym) || y.id - x.id), 'Nothing open. Find a rocket in Markets.');
    if (draw) { const cv = $('#nwchart'); if (cv) drawLineChart(cv, G.nwHist.concat([nw]), r >= 0 ? COL.up : COL.down); }
  },

  /* ---------- news ---------- */
  newsHTML() {
    const up = G.stories.filter(s => s.teased && !s.done).sort((x, y) => x.day - y.day);
    const when = d => d - G.day <= 0 ? 'This week' : d - G.day === 1 ? 'Next week' : `In ${d - G.day} weeks`;
    return `<div class="sec" style="margin-top:0"><h3>Upcoming events</h3>${up.length ? `<div class="cal">${up.map(s => `<button class="calrow" ${s.sym ? `data-act="asset" data-sym="${s.sym}"` : ''}><span class="when">${when(s.day)}</span><b>${s.cal}</b><span class="tagc t-sym">${s.sym || 'MARKET'}</span></button>`).join('')}</div>` : '<div class="empty">Nothing on the calendar. Watch for teasers in the feed.</div>'}</div>
      <div class="sec"><h3>Live feed</h3><div class="list" id="nlist">${this.newsItems(G.news.slice(0, 70), 'Quiet so far. Headlines land during the week.')}</div></div>`;
  },
  newsMeta(n) {
    return `<div class="nmeta"><span>W${n.day} · ${clockStr(n.tick)}</span>${n.tag ? `<span class="tagc t-${n.tag.toLowerCase()}">${n.tag}</span>` : ''}${n.sym ? `<span class="tagc t-sym">${n.sym}</span>` : ''}${n.rating && G.rank >= 2 ? `<span class="tagc t-${n.rating === 'RELIABLE' ? 'rel' : 'sk'}">SOURCE ${n.rating}</span>` : ''}</div>`;
  },
  newsItems(list, empty) {
    if (!list.length) return `<div class="empty">${empty}</div>`;
    return list.map(n => `<button class="nitem ${n.tag === 'BREAKING' ? 'brk' : ''} ${n.kind === 'fill' ? 'fill' : ''}" ${n.sym && A(n.sym) ? `data-act="asset" data-sym="${n.sym}"` : ''} data-nid="${n.id}">
      ${this.newsMeta(n)}<div class="nh">${n.h}</div>${n.sym && n.px ? '<div class="nsince" data-f="since"></div>' : ''}</button>`).join('');
  },
  liveSince() {
    $$('#view .nitem').forEach(el => {
      const s = el.querySelector('[data-f=since]'); if (!s) return;
      const n = G.news.find(x => x.id === +el.dataset.nid); if (!n) return;
      const a = A(n.sym);
      if (!a || a.dead) { s.textContent = 'Delisted'; s.className = 'nsince down'; return; }
      const d = a.price / n.px - 1; s.textContent = `${fmtPct(d)} since headline`; s.className = 'nsince ' + dirCls(d);
    });
  },

  /* ---------- career ---------- */
  careerHTML() {
    const r = RANKS[G.rank], nx = RANKS[G.rank + 1];
    const prog = nx ? clamp(Math.log(G.peak / Math.max(r.min, START_CASH)) / Math.log(nx.min / Math.max(r.min, START_CASH)), 0, 1) : 1;
    return `<div class="card rankhero"><div class="lbl">Your rank</div><div class="rn">${r.n}</div>
        <div class="prog"><i style="width:${prog * 100}%"></i></div>
        <p style="color:var(--muted);margin:10px 0 0;font-size:13px">${nx ? `Peak ${fmtMoney(G.peak)} · next: <b style="color:var(--fg)">${nx.n}</b> at ${fmtMoney(nx.min)}` : 'You have reached the top. The market bows.'}</p></div>
      <div class="sec"><h3>The ladder</h3><div class="ladder">${RANKS.map((x, i) => `<div class="rung ${i <= G.rank ? 'got' : 'lock'} ${i === G.rank ? 'cur' : ''}"><span class="i">${i + 1}</span><span><b>${x.n}</b><small>${x.u}</small></span><span class="th">${fmtMoney(x.min)}</span></div>`).join('')}</div></div>
      <div class="sec"><h3>Career stats</h3><div class="kv" style="grid-template-columns:repeat(2,minmax(0,1fr))">
        <div class="stat"><div class="lbl">Weeks traded</div><b>${G.day}</b></div>
        <div class="stat"><div class="lbl">Peak net worth</div><b>${fmtMoney(G.peak)}</b></div>
        <div class="stat"><div class="lbl">Best trade</div><b class="up">${fmtMoney(G.stats.best, true)}</b></div>
        <div class="stat"><div class="lbl">Worst trade</div><b class="down">${fmtMoney(G.stats.worst, true)}</b></div>
        <div class="stat"><div class="lbl">Bailouts</div><b>${G.bailouts}</b></div>
        <div class="stat"><div class="lbl">Liquidations</div><b>${G.stats.liqs}</b></div></div></div>
      <div class="sec"><h3>Settings</h3><div class="setrow"><button class="btn2" data-act="sound">Sound: ${SFX.on ? 'On' : 'Off'}</button><button class="btn2 danger" data-act="restart">Restart career</button></div></div>`;
  },

  /* ---------- price tape ---------- */
  renderTape() {
    const one = G.assets.map(a => `<span data-s="${a.s}"><em>${a.s}</em><b></b></span>`).join('');
    $('#tape').innerHTML = one + one;
  },
  liveTape() {
    $$('#tape span').forEach(sp => {
      const a = A(sp.dataset.s); if (!a) return;
      const c = chg(a), b = sp.querySelector('b');
      b.textContent = a.dead ? 'HALTED' : `${fmtPrice(a.price)} ${c >= 0 ? '▲' : '▼'}${fmtPct(Math.abs(c), false)}`; b.className = a.dead ? 'down' : dirCls(c);
    });
  },

  /* ---------- per-tick ---------- */
  onTick() {
    if (!G || !this.started) return;
    this.live(true);
    if (G.tick % 4 === 0) this.liveTape();
    if (this.sheet) this.liveSheet();
  },
  live(tickDraw) {
    const nw = netWorth();
    $('#dayLbl').textContent = 'WEEK ' + G.day; $('#timeLbl').textContent = clockStr(G.tick);
    $('#dayBar').style.width = (G.tick / TPD * 100) + '%';
    const dch = nw - G.dayStartNW, el = $('#nwChg');
    el.textContent = `${fmtMoney(dch, true)} (${fmtPct(G.dayStartNW ? dch / G.dayStartNW : 0)}) this week`; el.className = 'chg ' + dirCls(dch);
    $('#cash').textContent = fmtMoney(G.cash);
    $('#rankChip').textContent = RANKS[G.rank].n;
    const dot = $('#newsDot'); if (dot) { dot.hidden = !this.unread || this.tab === 'news'; dot.textContent = this.unread > 9 ? '9+' : this.unread; }
    if (this.detail) this.liveDetail();
    else if (this.tab === 'markets') this.liveMarkets(true);
    else if (this.tab === 'portfolio') this.livePortfolio(true);
    if (this.detail || this.tab === 'news') this.liveSince();
  },
  frame(now) {
    if (!this.started) { if (!$('#start').hidden) StartFx.draw($('#startfx'), now); return; }
    // net worth count-up
    const nw = netWorth(), d = nw - this.nwShown;
    if (Math.abs(d) > .005) {
      this.nwShown += d * .2; if (Math.abs(nw - this.nwShown) < .01) this.nwShown = nw;
      const e = $('#nw'); e.textContent = fmtMoney(this.nwShown);
      if (Math.abs(d) / Math.max(1, nw) > .004) { e.classList.toggle('gup', d > 0); e.classList.toggle('gdn', d < 0); clearTimeout(this._nwT); this._nwT = setTimeout(() => e.classList.remove('gup', 'gdn'), 450); }
    }
    if (this.detail) { const cv = $('#chart'); const a = A(this.detail); if (cv && a) drawPriceChart(cv, a, this.tf, now, this.cross); }
  },

  /* ---------- events from engine ---------- */
  onNews(n) {
    if (!this.started) return;
    if (this.tab !== 'news' || this.detail) this.unread++;
    const important = n.kind !== 'fill';
    if (important) {
      this.toast(n);
      if (n.tag === 'BREAKING') { SFX.play('breaking'); buzz([30, 40, 30]); } else SFX.play('news');
    }
    // live-insert into visible lists
    const box = this.tab === 'news' && !this.detail ? $('#nlist') : (this.detail && n.sym === this.detail ? $('#dnews') : null);
    if (box) { const emp = box.querySelector('.empty'); if (emp) emp.remove(); box.insertAdjacentHTML('afterbegin', this.newsItems([n], '')); }
    if (this.tab === 'news' && !this.detail && (n.kind === 'tease' || n.kind === 'out')) { const st = $('#view').scrollTop; this.render(); $('#view').scrollTop = st; }
  },
  toast(n) {
    const box = $('#toasts'); $('#app').style.setProperty('--toast-top', ($('#top').offsetHeight + 34) + 'px');
    const el = document.createElement('button');
    const cls = n.tag === 'BREAKING' ? 'brk' : n.tag === 'RUMOR' ? 'rumor' : n.tag === 'TIP' ? 'tip' : '';
    el.className = 'toast ' + cls;
    el.innerHTML = `${this.newsMeta(n)}<div class="th">${n.h}</div>`;
    el.onclick = () => { SFX.play('tap'); if (n.sym && A(n.sym)) this.openAsset(n.sym); el.remove(); };
    box.prepend(el);
    while (box.children.length > 2) box.lastChild.remove();
    setTimeout(() => { el.classList.add('out'); setTimeout(() => el.remove(), 320); }, n.tag === 'BREAKING' ? 6000 : 4500);
  },
  msg(html, cls) {
    const box = $('#toasts'); $('#app').style.setProperty('--toast-top', ($('#top').offsetHeight + 34) + 'px');
    const el = document.createElement('div'); el.className = 'toast ' + cls; el.innerHTML = `<div class="th">${html}</div>`;
    box.prepend(el); while (box.children.length > 2) box.lastChild.remove();
    setTimeout(() => { el.classList.add('out'); setTimeout(() => el.remove(), 320); }, 3200);
  },
  onClose(p, net, reason) {
    if (!this.started) return;
    const roe = net / p.margin, r = this.lastTap; this.lastTap = null;
    const x = r ? r.left + r.width / 2 : innerWidth / 2, y = r ? r.top : appH() * .45;
    if (reason === 'liq') {
      SFX.play('liq'); buzz([80, 60, 200]); liquidationFx();
      this.msg(`<span class="down">LIQUIDATED</span> · ${p.sym} ${p.side.toUpperCase()} ${p.lev}× · ${fmtMoney(net, true)}`, 'bad');
    } else if (net >= 0) {
      const k = clamp(Math.log10(1 + Math.max(0, roe) * 10), .3, 3.5);
      SFX.play('profit', 1 + k); buzz(40);
      FX.burst(x, y, Math.round(20 + k * 45), 'win'); if (roe > 2) FX.rain(80);
      floatText(fmtMoney(net, true), reason === 'tp' ? 'TAKE PROFIT' : roe > 2 ? 'MOONSHOT!' : roe > .5 ? 'BIG WIN' : 'PROFIT', 'up', x, Math.max(120, y - 20));
      if (reason === 'tp') this.msg(`Take profit hit · ${p.sym} <span class="up">${fmtMoney(net, true)}</span>`, 'good');
    } else {
      SFX.play('loss'); buzz(60);
      floatText(fmtMoney(net, true), reason === 'sl' ? 'STOP LOSS' : reason === 'halt' ? 'HALTED' : 'LOSS', 'down', x, Math.max(120, y - 20));
      if (reason === 'sl' || reason === 'halt') this.msg(`${reason === 'sl' ? 'Stop loss hit' : 'Trading halted'} · ${p.sym} <span class="down">${fmtMoney(net, true)}</span>`, 'bad');
    }
    if (!this.detail && this.tab === 'portfolio') { const st = $('#view').scrollTop; this.render(); $('#view').scrollTop = st; }
  },
  rankUp(r) {
    if (!this.started) return;
    SFX.play('rank'); buzz([40, 40, 120]); FX.rain(140);
    this.modal(`<div class="badge-ic" style="background:rgba(255,200,74,.12);border:1px solid rgba(255,200,74,.45);color:var(--gold);box-shadow:0 0 30px rgba(255,200,74,.35)">★</div>
      <div class="kicker" style="margin-top:14px;color:var(--gold)">Rank up</div><h2 style="color:var(--gold)">${r.n}</h2>
      <p>You crossed ${fmtMoney(r.min)}. Unlocked: <b style="color:var(--fg)">${r.u}</b>.</p>
      <button class="big-btn gold" data-m="ok">KEEP CLIMBING</button>`, () => this.closeModal());
  },
  bailout() {
    if (this.bailing || !this.started) return;
    this.bailing = true; SFX.play('loss');
    this.modal(`<div class="badge-ic" style="background:rgba(255,63,116,.12);border:1px solid rgba(255,63,116,.45);color:var(--down)">$0</div>
      <h2 style="margin-top:14px">Wiped out</h2>
      <p>Your account is empty. Uncle Rick wires you <b style="color:var(--fg)">${fmtMoney(BAILOUT)}</b> with a note: "Don't tell your mother."</p>
      <button class="big-btn" data-m="ok">BACK IN THE GAME</button>`, () => {
      G.cash += BAILOUT; G.bailouts++; G.dayStartNW += BAILOUT; this.bailing = false; this.closeModal(); save(); this.live();
    });
  },
  showDayEnd(s) {
    SFX.play('bell');
    if (s.pnl > 0 && s.pct > .05) FX.rain(60);
    const up = G.stories.filter(x => x.teased && !x.done && x.day <= G.day + 2).sort((x, y) => x.day - y.day);
    const when = d => d - G.day <= 1 ? 'Next week' : `In ${d - G.day} weeks`;
    this.modal(`<div class="kicker">Closing bell · Friday</div><h2>Week ${s.day} closed</h2>
      <div class="hero ${dirCls(s.pnl)}">${fmtMoney(s.pnl, true)}</div>
      <div class="${dirCls(s.pnl)}" style="font:700 13px var(--f-mono)">${fmtPct(s.pct)} this week</div>
      <div class="mgrid">
        <div><div class="lbl">Net worth</div><b>${fmtMoney(s.nw)}</b></div>
        <div><div class="lbl">Open positions</div><b>${G.positions.length}</b></div>
        <div><div class="lbl">Gainer of the week</div><b class="up">${s.top ? s.top.s + ' ' + fmtPct(s.top.ch) : '–'}</b></div>
        <div><div class="lbl">Loser of the week</div><b class="down">${s.bot ? s.bot.s + ' ' + fmtPct(s.bot.ch) : '–'}</b></div>
      </div>
      ${up.length ? `<div class="mlist">${up.map(x => `<div class="li"><b style="width:auto;color:var(--gold)">${when(x.day)}</b><span>${x.cal} · ${x.sym || 'Market'}</span></div>`).join('')}</div>` : ''}
      ${G.positions.length ? '<p style="font-size:12px">Your positions stay open over the weekend. Weekend news can gap prices at the Monday open.</p>' : ''}
      <button class="big-btn" data-m="ok">START WEEK ${s.day + 1}</button>`, () => {
      this.closeModal(); nextDay(); SFX.play('open'); this.renderTape(); this.render(); this.liveTape();
    });
  },

  /* ---------- trade sheet ---------- */
  openSheet(side) {
    const a = A(this.detail); if (!a || a.dead) return;
    SFX.play('tap');
    const lv = levels();
    this.sheet = { side, sym: a.s, pct: G.cash > 0 ? .25 : 0, lev: lv.includes(G.lastLev) ? G.lastLev : 2, tp: 0, sl: 0 };
    const S = this.sheet, wrap = $('#sheet');
    const opt = (grp, val, label, on, locked) => `<button class="opt ${on ? 'on' : ''} ${locked ? 'lock' : ''} ${grp === 'lev' && val >= 10 && on ? 'hot' : ''}" data-g="${grp}" data-v="${val}" ${locked ? 'disabled' : ''}>${locked ? ICON.lock : ''}${label}</button>`;
    const draw = () => {
      wrap.innerHTML = `<div class="sheet" role="dialog" aria-label="Open position"><div class="grab"></div>
        <div class="shead"><span class="logo" style="--c:${a.c}">${a.s[0]}</span><h2 class="${side === 'long' ? 'up' : 'down'}">${side.toUpperCase()} ${a.s}</h2><span class="px num" id="shPx"></span></div>
        <div class="flabel"><span class="lbl">Stake (from cash ${fmtMoney(G.cash)})</span><b id="shAmt"></b></div>
        <div class="opts">${[.1, .25, .5, 1].map(p => opt('pct', p, p === 1 ? 'MAX' : p * 100 + '%', Math.abs(S.pct - p) < .001)).join('')}</div>
        <input type="range" id="shRange" min="1" max="100" step="1" value="${Math.round(S.pct * 100)}" aria-label="Stake percent">
        <div class="flabel"><span class="lbl">Leverage</span><b id="shLev">${S.lev}×</b></div>
        <div class="opts c5" style="grid-template-columns:repeat(${Math.min(ALL_LEV.length, 7)},minmax(0,1fr))">${ALL_LEV.map(l => opt('lev', l, l + '×', S.lev === l, !lv.includes(l))).join('')}</div>
        <div class="flabel"><span class="lbl">Take profit</span></div>
        <div class="opts">${[[0, 'Off'], [.25, '+25%'], [.5, '+50%'], [1, '+100%']].map(([v, l]) => opt('tp', v, l, S.tp === v)).join('')}</div>
        <div class="flabel"><span class="lbl">Stop loss</span></div>
        <div class="opts">${[[0, 'Off'], [.15, '-15%'], [.3, '-30%'], [.5, '-50%']].map(([v, l]) => opt('sl', v, l, S.sl === v)).join('')}</div>
        <div class="summary">
          <div><div class="lbl">Position size</div><b id="shSize"></b></div>
          <div><div class="lbl">Liquidation price</div><b class="down" id="shLiq"></b></div>
          <div><div class="lbl">Move of 10% pays</div><b class="up" id="shTen"></b></div>
          <div><div class="lbl">Fee</div><b id="shFee"></b></div>
        </div>
        <div class="warn" id="shWarn"></div>
        <div class="sfoot"><button class="big-btn ${side}" id="shGo">CONFIRM ${side.toUpperCase()}</button>
        <button class="ghost" id="shCancel">Cancel</button></div></div>`;
      this.liveSheet();
      $('#shRange').oninput = e => { S.pct = +e.target.value / 100; $$('.opt[data-g=pct]', wrap).forEach(b => b.classList.toggle('on', Math.abs(+b.dataset.v - S.pct) < .001)); this.liveSheet(); };
    };
    draw();
    wrap.hidden = false;
    wrap.onclick = e => {
      if (e.target === wrap || e.target.id === 'shCancel') { SFX.play('tap'); this.closeSheet(); return; }
      if (e.target.id === 'shGo') { this.confirmTrade(); return; }
      const b = e.target.closest('.opt'); if (!b || b.disabled) return;
      SFX.play('tap'); const g = b.dataset.g; S[g] = +b.dataset.v;
      // update in place so the sheet does not jump or replay its animation
      $$(`.opt[data-g=${g}]`, wrap).forEach(o => { const on = Math.abs(+o.dataset.v - S[g]) < .001; o.classList.toggle('on', on); o.classList.toggle('hot', g === 'lev' && on && S.lev >= 10); });
      if (g === 'pct') $('#shRange').value = Math.round(S.pct * 100);
      if (g === 'lev') $('#shLev').textContent = S.lev + '×';
      this.liveSheet();
    };
  },
  liveSheet() {
    const S = this.sheet; if (!S) return; const a = A(S.sym); if (!a) return;
    const amt = G.cash * S.pct, margin = amt / (1 + S.lev * FEE), size = margin * S.lev;
    const liq = S.side === 'long' ? a.price * (1 - LIQ / S.lev) : a.price * (1 + LIQ / S.lev);
    const set = (id, t) => { const e = $('#' + id); if (e) e.textContent = t; };
    set('shPx', fmtPrice(a.price)); set('shAmt', fmtMoney(amt)); set('shSize', fmtMoney(size));
    set('shLiq', S.lev === 1 && S.side === 'long' ? 'near zero' : fmtPrice(liq) + ` (${S.side === 'long' ? '-' : '+'}${(LIQ / S.lev * 100).toFixed(S.lev >= 25 ? 1 : 0)}%)`);
    set('shTen', fmtMoney(size * .1, true)); set('shFee', fmtMoney(amt - margin));
    const r = $('#shRange'); if (r) r.style.setProperty('--fillp', (S.pct * 100) + '%');
    set('shWarn', amt < 1 ? 'Not enough cash. Close a position first.' : S.lev >= 25 ? `At ${S.lev}× a ${(LIQ / S.lev * 100).toFixed(1)}% move against you wipes the stake.` : S.lev >= 10 ? 'High leverage. Small moves hit hard.' : '');
    const go = $('#shGo'); if (go) go.disabled = amt < 1 || a.dead;
  },
  confirmTrade() {
    const S = this.sheet; if (!S) return;
    const p = openPosition(S.sym, S.side, G.cash * S.pct, S.lev, S.tp, S.sl);
    if (!p) return;
    SFX.play(S.side === 'long' ? 'buy' : 'short'); buzz(25);
    const r = $('#shGo').getBoundingClientRect();
    FX.burst(r.left + r.width / 2, r.top, 18, 'win');
    this.closeSheet();
    this.msg(`Opened <b class="${S.side === 'long' ? 'up' : 'down'}">${S.side.toUpperCase()} ${S.lev}×</b> ${S.sym} · stake ${fmtMoney(p.margin)} at ${fmtPrice(p.entry)}`, S.side === 'long' ? 'good' : 'bad');
    this.live();
  },
  closeSheet() { this.sheet = null; $('#sheet').hidden = true; $('#sheet').innerHTML = ''; },
};
/* ===== boot + loop ===== */
let lastT = performance.now(), acc = 0;
function frame(now) {
  const dt = Math.min(120, now - lastT); lastT = now;
  if (G && UI.started && G.phase === 'open' && !UI.paused && !UI.block) {
    acc += dt * UI.speed;
    let guard = 0;
    while (acc >= TICK_MS && guard++ < 6) {
      acc -= TICK_MS; tick();
      if (G.phase !== 'open' || UI.block) { acc = 0; break; }
    }
  } else acc = 0;
  try { UI.frame(now); } catch (e) { console.error(e); }
  FX.step();
  requestAnimationFrame(frame);
}
function fitScreen() {
  if (!IOS_APP) return;
  const r = document.documentElement;
  r.classList.add('ios-app');
  r.style.setProperty('--app-h', appH() + 'px');
}
fitScreen(); addEventListener('resize', fitScreen);
UI.init();
FX.init();
UI.showStart();
requestAnimationFrame(frame);
</script>
<script>if('serviceWorker' in navigator && location.protocol==='https:'){navigator.serviceWorker.register('sw.js').catch(function(){})}</script></body></html>
